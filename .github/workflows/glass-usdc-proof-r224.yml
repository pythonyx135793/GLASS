name: GLASS USDC exact-source validation
on:
  push:
    branches: [codex/glass-usdc-proof-r224]
    paths: [.github/workflows/glass-usdc-proof-r224.yml]
permissions:
  contents: read
concurrency:
  group: glass-usdc-issue1-r224
  cancel-in-progress: false
jobs:
  offline-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact application
        uses: actions/checkout@v4
        with:
          ref: c5de94674aa94239140d500f07f59243d86bbf00
          path: app
          persist-credentials: false
      - name: Check out original source for regression control
        uses: actions/checkout@v4
        with:
          ref: 9649c7c590239d2a91d8c1bd6e2b2a023c48732a
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact source and offline test setup
        shell: bash
        run: |
          test "$(git -C app rev-parse HEAD)" = c5de94674aa94239140d500f07f59243d86bbf00
          test "$(git -C app rev-parse HEAD^{tree})" = d89c7071183e9d3481dd8e7dd41b909ff12182be
          test "$(git -C baseline rev-parse HEAD)" = 9649c7c590239d2a91d8c1bd6e2b2a023c48732a
          test -z "$(git -C app status --porcelain)"
          test -z "$(git -C baseline status --porcelain)"
          node --version
          npm --version
          node -p 'Intl.NumberFormat().resolvedOptions().locale'
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('app/package.json')); if(p.scripts.test!=='node --test test/*.test.mjs'||p.scripts.pretest||p.scripts.posttest||Object.keys(p.dependencies||{}).length||Object.keys(p.devDependencies||{}).length) process.exit(1);"
          cat > "$RUNNER_TEMP/offline-guard.mjs" <<'EOF'
          globalThis.fetch = async () => { throw new Error('Offline test attempted network access'); };
          globalThis.WebSocket = class { constructor() { throw new Error('Offline test attempted websocket access'); } };
          EOF
          echo "NODE_OPTIONS=--import=$RUNNER_TEMP/offline-guard.mjs" >> "$GITHUB_ENV"
          echo "npm_config_cache=$RUNNER_TEMP/npm-cache" >> "$GITHUB_ENV"
      - name: Original unchanged full offline suite
        working-directory: baseline
        run: npm test
      - name: New regression cases fail against original source
        shell: bash
        run: |
          cp app/test/quote-pricing.test.mjs baseline/test/quote-pricing.test.mjs
          set +e
          (cd baseline && node --test --test-reporter=tap test/quote-pricing.test.mjs) > "$RUNNER_TEMP/baseline-regressions.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/baseline-regressions.log"
          test "$result" -eq 1
          grep -Fx '# pass 0' "$RUNNER_TEMP/baseline-regressions.log"
          grep -Fx '# fail 18' "$RUNNER_TEMP/baseline-regressions.log"
          test "$(grep -c "code: 'ERR_ASSERTION'" "$RUNNER_TEMP/baseline-regressions.log")" -eq 18
          rm baseline/test/quote-pricing.test.mjs
          test -z "$(git -C baseline status --porcelain)"
      - name: Complete fixed-source offline suite
        working-directory: app
        run: npm test
      - name: Syntax and final source hygiene
        shell: bash
        run: |
          find app/src app/test -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | while IFS= read -r -d '' file; do node --check "$file"; done
          git -C app diff --check
          test "$(git -C app rev-parse HEAD)" = c5de94674aa94239140d500f07f59243d86bbf00
          test "$(git -C app rev-parse HEAD^{tree})" = d89c7071183e9d3481dd8e7dd41b909ff12182be
          test -z "$(git -C app status --porcelain)"
          test -z "$(git -C baseline status --porcelain)"
          printf '%s\n' 'Application: c5de94674aa94239140d500f07f59243d86bbf00. Original full suite, regression negative control, fixed full suite, syntax and clean source checks. Offline mocks only; no extension installation, wallet or RPC execution.' >> "$GITHUB_STEP_SUMMARY"

